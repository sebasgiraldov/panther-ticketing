spring:
  application:
    name: panther-ticketing
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT}
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT}
  address: 0.0.0.0
  shutdown: graceful

aws:
  region: ${AWS_REGION}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT}
    tables:
      events: ${DYNAMODB_TABLE_EVENTS}
      ticket-types: ${DYNAMODB_TABLE_TICKET_TYPES}
      tickets: ${DYNAMODB_TABLE_TICKETS}
      reservations: ${DYNAMODB_TABLE_RESERVATIONS}
      orders: ${DYNAMODB_TABLE_ORDERS}
      inventory: ${DYNAMODB_TABLE_INVENTORY}
      audit: ${DYNAMODB_TABLE_AUDIT}
  sqs:
    endpoint: ${SQS_ENDPOINT}
    queue-url: ${SQS_QUEUE_URL}

reservation:
  minutes: 10
  scheduler:
    delay-ms: ${RESERVATION_SCHEDULER_DELAY_MS}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: "/actuator"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL}
    com.panther.ticketing: ${LOG_LEVEL}
