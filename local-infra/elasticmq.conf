# ElasticMQ configuration — declarative queue setup (SQS-compatible).
# ElasticMQ creates these queues on startup, so provisioning is deterministic
# and the app finds the queue ready. This is the local stand-in for what SQS
# (provisioned by Terraform) would be in production.

include classpath("application.conf")

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    # Report this account id in queue URLs so they match the app's expected format
    # (http://sqs:9324/000000000000/panther-orders).
    sqs-limits = strict
}

queues {
    panther-orders {
        # After 5 failed receives, move the message to the DLQ.
        deadLettersQueue {
            name = "panther-orders-dlq"
            maxReceiveCount = 5
        }
        defaultVisibilityTimeout = 30 seconds
    }
    panther-orders-dlq { }
}
